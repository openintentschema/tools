[project]
name = "ois-validator"
version = "0.5.0"
description = "Reference validator for the Open Intent Schema (OIS)"
keywords = ["ois", "open-intent-schema", "requirements", "traceability", "evidence", "in-toto", "junit", "coverage"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "jsonschema[format-nongpl]>=4.26.0",
    "pyyaml>=6.0.3",
    "rfc8785>=0.1.4",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
ois-validator = "ois_validator.cli:main"
ois-junit = "ois_validator.junit_cli:main"
ois-intent = "ois_validator.intent_cli:main"
ois-passport = "ois_validator.passport_cli:main"
ois-record = "ois_validator.record_cli:main"
ois-coverage = "ois_validator.coverage_cli:main"

[project.urls]
Repository = "https://github.com/openintentschema/validator"
Documentation = "https://github.com/openintentschema/validator/tree/main/docs"
Changelog = "https://github.com/openintentschema/validator/blob/main/CHANGELOG.md"
Issues = "https://github.com/openintentschema/validator/issues"
Specification = "https://github.com/openintentschema/openintentschema"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "referencing.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
