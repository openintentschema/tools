[project]
name = "ois-tools"
version = "0.11.0"
description = "Reference tools for the Open Intent Schema (OIS): validate, record and attest what was required, built and proven"
keywords = ["ois", "open-intent-schema", "requirements", "traceability", "evidence", "in-toto", "junit", "coverage"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "gherkin-official>=42.0.1",
    "jsonschema[format-nongpl]>=4.26.0",
    "pyyaml>=6.0.3",
    "rfc8785>=0.1.4",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
sigstore = ["sigstore>=4.5.1"]  # verify keyless (Sigstore) signatures

[project.scripts]
ois = "ois_tools.cli:main"

[project.urls]
Repository = "https://github.com/openintentschema/tools"
Documentation = "https://github.com/openintentschema/tools/tree/main/docs"
Changelog = "https://github.com/openintentschema/tools/blob/main/CHANGELOG.md"
Issues = "https://github.com/openintentschema/tools/issues"
Specification = "https://github.com/openintentschema/openintentschema"

[dependency-groups]
dev = [
    "sigstore>=4.5.1",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "referencing.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
