# include: remote: https://raw.githubusercontent.com/openintentschema/tools/v0.12.0/.gitlab/ci/ois.gitlab-ci.yml

# Any ois command, in the image of this release.
.ois:
  image:
    name: ghcr.io/openintentschema/ois-tools:0.12.0
    entrypoint: [""]

# Record test results: set OIS_JUNIT_REPORTS, OIS_NAMESPACE and OIS_SUITE; runs after failed tests too.
.ois-junit:
  extends: .ois
  when: always
  script:
    - ois junit $OIS_JUNIT_REPORTS --namespace "$OIS_NAMESPACE" --suite "$OIS_SUITE"
      --run "$CI_JOB_URL" --output ois-bundle.json
  artifacts:
    when: always
    paths:
      - ois-bundle.json
